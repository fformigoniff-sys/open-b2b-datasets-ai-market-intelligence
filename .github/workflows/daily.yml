name: Esecuzione Giornaliera Master 8 Nicchie B2B

on:
  schedule:
    - cron: '0 3 * * *' # Si esegue ogni notte alle 03:00 UTC
  workflow_dispatch: # Permette l'avvio manuale con un clic

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permette a GitHub Actions di salvare i file generati

    steps:
    - name: Scarica il codice dal repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le librerie necessarie
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Esegui lo script master a 8 nicchie
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python collector.py

    - name: Salva e aggiorna automaticamente i dataset
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update all 8 B2B datasets [skip ci]"
        file_pattern: "*.*"
