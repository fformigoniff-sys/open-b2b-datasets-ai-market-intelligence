name: Esecuzione Giornaliera Master 8 Nicchie B2B

on:
  schedule:
    - cron: '0 3 * * *' # Si esegue automaticamente ogni notte alle 03:00 UTC
  workflow_dispatch: # Permette l'avvio manuale con un solo clic

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permette a GitHub Actions di salvare i file generati

    steps:
    - name: Scarica il codice dal repository
      uses: actions/checkout@v3

    - name: Configura Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installa le librerie necessarie
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Esegui lo script master a 8 nicchie
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python collector.py

    - name: Salva e aggiorna TUTTI i 8 dataset su GitHub
      run: |
        git config --global user.name "AutoBot"
        git config --global user.email "bot@github.com"
        git add .
        git commit -m "Auto-update all 8 B2B datasets [skip ci]" || exit 0
        git push
